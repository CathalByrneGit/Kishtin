# Kishtin's documentation site, built from the Markdown in docs/ with
# Zensical and published to GitHub Pages by .github/workflows/docs.yml.
# Build locally with `make docs`, or preview with `make docs-serve`.
[project]
site_name = "Kishtin"
site_url = "https://cathalbyrnegit.github.io/Kishtin/"
site_description = "A kitchen system that runs on one computer in your restaurant: HACCP records, the pass, a cook scheduler and voice control."
site_author = "Kishtin contributors"
copyright = "Kishtin is free software under the Apache License 2.0. Kishtin, from <em>cistin</em>, Irish for kitchen."
docs_dir = "docs"
site_dir = "website/site"
repo_url = "https://github.com/CathalByrneGit/Kishtin"
repo_name = "CathalByrneGit/Kishtin"
edit_uri = "edit/main/docs/"
extra_css = ["assets/stylesheets/extra.css"]
use_directory_urls = true
nav = [
  {"Overview" = "index.md"},
  {"Start here" = [
    {"Getting started" = "getting-started.md"},
    {"Installing Kishtin" = "install.md"},
    {"Keeping the computer safe" = "security.md"},
  ]},
  {"Run the kitchen" = [
    {"Screens" = "screens.md"},
    {"Menu, orders, the pass and the scheduler" = "kitchen.md"},
    {"Voice control" = "voice.md"},
    {"Reports" = "reports.md"},
  ]},
  {"Food safety" = [
    {"HACCP log" = "haccp.md"},
    {"Record books" = "record-books.md"},
    {"For your environmental health officer" = "for-inspectors.md"},
  ]},
  {"Set up and look after" = [
    {"Settings" = "settings.md"},
    {"Permissions" = "permissions.md"},
    {"What Kishtin records" = "recording.md"},
  ]},
  {"Tills" = [
    {"Orders from Square" = "square.md"},
    {"Sales from SumUp" = "sumup.md"},
  ]},
  {"Releases" = [
    {"v0.1.0" = "releases/v0.1.0.md"},
  ]},
]

[project.theme]
variant = "modern"
custom_dir = "website/overrides"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

# Light by default, like Kishtin's own screens; dark is a choice.
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
