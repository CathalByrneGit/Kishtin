version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      - internal/client/client.gen.go
      - internal/store/sqlite/sqlitedb
formatters:
  enable:
    - gofmt
