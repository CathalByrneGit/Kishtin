name: Docs

# Builds the documentation site from docs/ with Zensical on every pull
# request that touches it, and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["docs/**", "zensical.toml", "website/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "zensical.toml", "website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the site
        run: make docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
