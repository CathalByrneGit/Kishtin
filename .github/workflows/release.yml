name: Release

# Pushing a tag such as v0.2.0 runs the tests, then builds the downloads
# for Linux, macOS and Windows and publishes them as a GitHub release with
# SHA256SUMS, the install scripts, and a software bill of materials for
# each download and for the source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build the frontend for embedding
        run: make frontend
      - name: Test
        run: go test ./...
      # Release notes for owners, when docs/releases/<tag>.md exists;
      # otherwise GoReleaser lists the commits since the last release.
      - name: Release notes
        id: notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "flag=--release-notes=docs/releases/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi
      # syft makes the software bills of materials (.goreleaser.yaml, sboms).
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
