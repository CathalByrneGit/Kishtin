name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Frontend checks (svelte-check, unit tests, kit-ui-check)
        run: make frontend-test
      - name: Build the frontend for embedding
        run: make frontend
      - name: Test (pure-Go SQLite)
        run: go test -race ./...
      - name: Test (CGO SQLite)
        run: CGO_ENABLED=1 go test -tags sqlite_cgo ./...
      - name: Generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make generate
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Release config is valid
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Builds every release download once, as a release would, without
  # publishing it.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build every download
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 3

  # Installs the snapshot with the install script, as a restaurant would, on
  # Linux, macOS and Windows.
  install:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          KISHTIN_STARTUP=no KISHTIN_RELEASE_URL="$PWD/downloads" KISHTIN_INSTALL_DIR="$RUNNER_TEMP/kishtin" sh scripts/install.sh
          "$RUNNER_TEMP/kishtin/kishtind" --version
          "$RUNNER_TEMP/kishtin/kishtind" startup --json
          "$RUNNER_TEMP/kishtin/kishtin" --version
          "$RUNNER_TEMP/kishtin/kishtind" licenses > "$RUNNER_TEMP/licenses.txt"
          grep -q "Apache License" "$RUNNER_TEMP/licenses.txt"
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KISHTIN_RELEASE_URL = Join-Path $PWD 'downloads'
          $env:KISHTIN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'kishtin'
          $env:KISHTIN_NO_MODIFY_PATH = '1'
          $env:KISHTIN_STARTUP = 'no'
          ./scripts/install.ps1
          $exe = Join-Path $env:KISHTIN_INSTALL_DIR 'kishtind.exe'
          & $exe --version
          & (Join-Path $env:KISHTIN_INSTALL_DIR 'kishtin.exe') --version
      - name: Start with the computer (Task Scheduler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'kishtin\kishtind.exe'
          & $exe startup on
          if ($LASTEXITCODE -ne 0) { throw "startup on failed" }
          $task = schtasks /Query /TN Kishtin /XML | Out-String
          if ($task -notmatch '<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>') { throw "the task would stop after 72 hours: $task" }
          if (-not ((& $exe startup --json) | ConvertFrom-Json).on) { throw "startup does not report on" }
          & $exe startup stop
          & $exe startup off
          schtasks /Query /TN Kishtin 2>$null
          if ($LASTEXITCODE -eq 0) { throw "the task is still there after startup off" }
